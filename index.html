<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>送礼物小助手</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
  <h1>🎁 凯萱的送礼物小助手</h1>

  <!-- 1. 预算 -->
  <section class="card">
    <h2>💰 预算范围</h2>
    <div class="options" data-field="budget">
      <button>50元以内</button>
      <button>50-100</button>
      <button>100-200</button>
      <button>200-500</button>
      <button>500元以上</button>
    </div>
  </section>

  <!-- 2. 送礼方向 -->
  <section class="card">
    <h2>🎯 送礼方向</h2>
    <div class="options" data-field="target">
      <button>美妆护肤</button>
      <button>数码科技</button>
      <button>家居生活</button>
      <button>文创手作</button>
      <button>运动户外</button>
      <button>服饰配饰</button>
      <button>美食零食</button>
      <button>萌宠用品</button>
    </div>
  </section>

  <!-- 3. 礼物质感 -->
  <section class="card">
    <h2>✨ 礼物质感</h2>
    <div class="options" data-field="style">
      <button>实用型</button>
      <button>精致型</button>
      <button>创意型</button>
      <button>奢华型</button>
    </div>
  </section>

  <!-- 4. 送礼场景 -->
  <section class="card">
    <h2>🎉 送礼场景</h2>
    <div class="options" data-field="scene">
      <button>生日</button>
      <button>节日</button>
      <button>纪念日</button>
      <button>感谢答谢</button>
      <button>乔迁新居</button>
      <button>毕业升学</button>
      <button>结婚喜事</button>
      <button>随便送送</button>
    </div>
  </section>

  <!-- 5. 喜好描述 -->
  <section class="card">
    <h2>💬 朋友的喜好</h2>
    <textarea placeholder="描述一下朋友的喜好，比如喜欢粉色、喜欢滑雪、养了一只猫等…"></textarea>
  </section>

  <button class="submit-btn">✨ 帮我推荐礼物</button>

  <!-- 结果区域（只保留这一个） -->
  <div class="result" style="margin-top:30px;"></div>

</div>

<!-- 只保留 main.js -->
<script src="main.js"></script>

</body>
</html>
